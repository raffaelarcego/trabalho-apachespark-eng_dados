[project]
name = "trabalho-apachespark-eng-dados"
version = "0.1.0"
description = "Apache Spark (PySpark) com Delta Lake e Apache Iceberg"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark>=3.5.3,<3.6",
    "delta-spark==3.3.2",
    "jupyterlab>=4.2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trabalho_apachespark_eng_dados"]

[dependency-groups]
dev = [
    "blue>=0.9.1",
    "isort>=9.0.2",
    "pip-audit>=2.10.1",
    "pydocstyle>=6.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
lint = "ruff check . && blue --check --diff . && isort --check ."
format = "isort . && blue ."
test = "pytest --cov=trabalho_apachespark_eng_dados -vv"
audit = "pip-audit"
docs = "mkdocs serve"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]

